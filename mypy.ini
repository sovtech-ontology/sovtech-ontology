[mypy]
python_version = 3.13
warn_unused_configs = true
# Package test conftests collide as duplicate top-level modules. The
# sovereign-debt-monitor directory is untracked but kept on disk.
exclude = (?x)^(
      packages/[^/]+/tests/conftest\.py$
    | packages/sovereign-debt-monitor/
    )

# pyld ships no type stubs and no py.typed marker.
[mypy-pyld.*]
ignore_missing_imports = true
