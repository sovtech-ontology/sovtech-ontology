[mypy]
python_version = 3.13
warn_unused_configs = true

# pyld ships no type stubs and no py.typed marker.
[mypy-pyld.*]
ignore_missing_imports = true

# Untyped third-party libraries used by ontology-evals-pipeline.
[mypy-pdfplumber.*]
ignore_missing_imports = true

[mypy-datasketch.*]
ignore_missing_imports = true
