[mypy]
python_version = 3.13
warn_unused_configs = true
# Package test conftests collide as duplicate top-level modules.
exclude = (?x)^packages/[^/]+/tests/conftest\.py$

# pyld ships no type stubs and no py.typed marker.
[mypy-pyld.*]
ignore_missing_imports = true

# Untyped third-party libraries used by ontology-evals-pipeline.
[mypy-pdfplumber.*]
ignore_missing_imports = true

[mypy-datasketch.*]
ignore_missing_imports = true
