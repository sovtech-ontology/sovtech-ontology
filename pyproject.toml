[project]
name = "sovtech-ontology"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ontology",
]

[tool.uv.sources]
ontology = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/*",
]
# ontology-evals-pipeline is an empty placeholder until its branch lands.
# The other directories are untracked but kept on disk.
exclude = [
    "packages/ontology-evals-pipeline",
    "packages/sovereign-debt-monitor",
    "packages/tap-pdip",
    "packages/target-oxigraph",
    "packages/target-rdf-file",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "tee>=0.0.3",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.isort]
profile = "black"
known_first_party = [
    "ontology",
    "sovtech_ontology",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "tests",
    "packages/ontology/tests",
]
